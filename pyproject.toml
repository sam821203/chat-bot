[tool.poetry]
name = "chatbot"
version = "0.1.0"
description = "Flask API for AI chatbot with Google search integration."
authors = ["Yu Hao Huang <sam821203@yahoo.com.tw>"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11.11"
flask = "^3.0.0"
flask-cors = "^3.0.10"
openai = "^1.3"
pickle-mixin = "^1.0.2"
python-dotenv = "^1.0.1"
googlesearch-python = "^1.1.0"
google-custom-search = "^3.0.0"
gunicorn = "^23.0.0"
langgraph = "^0.2"
langchain-openai = "^0.2"
langchain-core = "^0.3"

[tool.poetry.scripts]
chatbot = "chatbot:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
